# ChaosLab fix "persistent-database": customers and visits keep their data across restarts.
# PetClinic's own `mysql` Spring profile, as its README describes, on one shared `petclinic`
# database (the visits table references customers' pets table). Applied and reverted by
# `python3 -m chaoslab verify persistent-database`; never part of the default stack.
services:
  mysql-server:
    image: mysql:8.4.5
    container_name: mysql-server
    command: ["--innodb-buffer-pool-size=64M", "--performance-schema=OFF"]
    environment:
      MYSQL_ROOT_PASSWORD: petclinic   # PetClinic's documented local default; the sandbox is not exposed
      MYSQL_DATABASE: petclinic
    volumes:
      - chaoslab-petclinic-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-ppetclinic", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M

  customers-service:
    environment:
      SPRING_PROFILES_ACTIVE: docker,mysql
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-server:3306/petclinic?allowPublicKeyRetrieval=true&useSSL=false
    depends_on:
      mysql-server:
        condition: service_healthy

  visits-service:
    environment:
      SPRING_PROFILES_ACTIVE: docker,mysql
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-server:3306/petclinic?allowPublicKeyRetrieval=true&useSSL=false
    depends_on:
      mysql-server:
        condition: service_healthy
      customers-service:   # visits' schema references the pets table customers creates
        condition: service_healthy

volumes:
  chaoslab-petclinic-mysql:
